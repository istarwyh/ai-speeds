name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: 'pnpm'

      - name: Verify Node runtime
        run: |
          node scripts/node-runtime.mjs
          node scripts/node-runtime.mjs --self-test

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify frozen homepage artifact
        run: |
          git ls-files --error-unmatch -- public/static/cc4pm-homepage.html public/_headers >/dev/null
          node scripts/prepare-cc4pm-homepage.mjs --self-test
          pnpm run prepare:homepage
          artifact_status=$(git status --porcelain --untracked-files=all -- public/static/cc4pm-homepage.html public/_headers)
          if [ -n "$artifact_status" ]; then
            printf '%s\n' "$artifact_status"
            exit 1
          fi

      - name: Validate architecture boundaries
        run: |
          pnpm run architecture:check
          pnpm run architecture:check:self-test

      - name: Lint without changes
        run: pnpm run lint:check

      - name: Validate Share registry
        run: pnpm run shares:validate -- --registry-only

      - name: Build Next.js application
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Validate public Share assets
        run: pnpm run shares:validate -- --remote --timeout-ms 60000

      - name: Build for Cloudflare Workers
        run: pnpm run cf:build

      - name: Revalidate architecture and frozen homepage artifact
        run: |
          pnpm run architecture:check
          git ls-files --error-unmatch -- public/static/cc4pm-homepage.html public/_headers >/dev/null
          test -f .open-next/assets/_headers
          cmp public/_headers .open-next/assets/_headers
          artifact_status=$(git status --porcelain --untracked-files=all -- public/static/cc4pm-homepage.html public/_headers)
          if [ -n "$artifact_status" ]; then
            printf '%s\n' "$artifact_status"
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec opennextjs-cloudflare deploy
