name: PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify build readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: 'pnpm'

      - name: Verify Node runtime
        run: |
          node scripts/node-runtime.mjs
          node scripts/node-runtime.mjs --self-test

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify frozen homepage artifact
        run: |
          git ls-files --error-unmatch -- public/static/cc4pm-homepage.html public/_headers >/dev/null
          node scripts/prepare-cc4pm-homepage.mjs --self-test
          pnpm run prepare:homepage
          artifact_status=$(git status --porcelain --untracked-files=all -- public/static/cc4pm-homepage.html public/_headers)
          if [ -n "$artifact_status" ]; then
            printf '%s\n' "$artifact_status"
            exit 1
          fi

      - name: Validate architecture boundaries
        run: |
          pnpm run architecture:check
          pnpm run architecture:check:self-test

      - name: Verify deploy workflow scripts exist
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const workflow = '.github/workflows/deploy.yml';
          const content = readFileSync(workflow, 'utf8');
          const builtins = new Set(['install', 'dlx', 'exec', 'add', 'remove', 'update', 'audit']);
          const missing = [];

          for (const match of content.matchAll(/\bpnpm[ \t]+(?:run[ \t]+)?([A-Za-z0-9:_-]+)/g)) {
            const command = match[1];
            if (!builtins.has(command) && !pkg.scripts?.[command]) {
              missing.push(`${workflow}: pnpm ${command}`);
            }
          }

          if (missing.length) {
            console.error(`Missing package scripts:\n${missing.map((line) => `- ${line}`).join('\n')}`);
            process.exit(1);
          }
          NODE

      - name: Lint without changes
        run: pnpm run lint:check

      - name: Validate Share registry
        run: pnpm run shares:validate -- --registry-only

      - name: Build Next.js application
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build for Cloudflare Workers
        run: pnpm run cf:build

      - name: Revalidate architecture and frozen homepage artifact
        run: |
          pnpm run architecture:check
          git ls-files --error-unmatch -- public/static/cc4pm-homepage.html public/_headers >/dev/null
          test -f .open-next/assets/_headers
          cmp public/_headers .open-next/assets/_headers
          artifact_status=$(git status --porcelain --untracked-files=all -- public/static/cc4pm-homepage.html public/_headers)
          if [ -n "$artifact_status" ]; then
            printf '%s\n' "$artifact_status"
            exit 1
          fi
